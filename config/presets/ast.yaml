data:
  slice_length: 0.1
  sample_rate: 48000

model:
  backbone: "ast"
  input_channels: 1
  spectrogram_size: [128, 224]
  pretrained: false
  pretrained_weights: null  # set to pretrained checkpoint path/URL if available
  type: "classification"
  num_classes: 6
  classes: [25, 30, 35, 40, 45, 50]

training:
  batch_size: 8
  num_epochs: 50
